<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description" content="A product evaluation form with submitting confirmation page.">
    <meta name="author" content="Celi Macêdo">
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form action="review.html" method="get" class="wf1">
            <fieldset>
            <legend>Product</legend>    
                <label for="product">Product Name</label>
                    <select name="product" id="product" required>
                        <option value="" disabled selected>Select a Product...</option>
                    </select>
                
                <label>Overall Rating*</label>
                <div class="stars">
                    <input type="radio" id="fivestar" name="stars" value="5" required><label for="fivestar"></label>
                    <input type="radio" id="fourstar" name="stars" value="4" required><label for="fourstar"></label>
                    <input type="radio" id="threestar" name="stars" value="3" required><label for="threestar"></label>
                    <input type="radio" id="twostar" name="stars" value="2" required><label for="twostar"></label>
                    <input type="radio" id="onestar" name="stars" value="1" required><label for="onestar"></label>
                </div>

                <label for="date">Date of Installation</label>
                <input type="date" name="date" id="date" required>
                
                <p class="features">Which features did you find useful in the product?</p>
                <p class="paragraph">(Check all that apply)</p> 

                <input type="checkbox" id="durability" name="features" value="durability">
                <label for="durability" class="checkbox-label">Durability</label><br>

                <input type="checkbox" id="ease-of-use" name="features" value="ease-of-use">
                <label for="ease-of-use" class="checkbox-label">Ease of Use</label><br>

                <input type="checkbox" id="performance" name="features" value="performance">
                <label for="performance" class="checkbox-label">Performance</label><br>

                <input type="checkbox" id="design" name="features" value="design">
                <label for="design" class="checkbox-label">Design</label>
                
            </fieldset>
            <fieldset>    
            <legend>Your Review</legend> 
                <label for="review">Written Review <span class="optional">(Optional)</span></label> 
                <textarea id="review" name="review"></textarea>
                
               <label for="username">Your Name <span class="optional">(Optional)</span></label> 
               <input type="text" id="username" name="userName">
               
            </fieldset>        
               
            <input type="submit" value="Post Review">
           
        </form>
    </main>

    <footer>
        <div class="footer">
            <p>© <span id="currentYear"></span>  🪸 Celi Macêdo 🪸 Brazil</p>
        </div>
        <div class="modified">
            <p><span id="lastModified"></span></p>
        </div>
    </footer>
</body>
</html>
